# .github/workflows/ci.yml  (mcp-trust-anchor)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      # Start with the strict-but-safe rule set (syntax errors, undefined names).
      # Once green, drop --select to enable the full default rule set.
      - name: Lint
        run: ruff check server client tools --select E9,F63,F7,F82 --output-format=github
      - name: Byte-compile
        run: python -m compileall -q server client tools

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Start Trust Anchor + Redis
        run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "healthy after $((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "server never became healthy"
          docker compose logs
          exit 1
      - name: Run installation tests
        run: bash scripts/test-installation.sh http://localhost:8000
      - name: Tear down
        if: always()
        run: docker compose down -v
